<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>

  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/scripts/sound.js"></script>

</head>
<body class="blog">
  <div id="page-fade" class="active"></div>

  <main id="scene" aria-label="Background scene">
    <section class="basic-page" aria-labelledby="post-title">
      <div class="basic-page-header">
        <p class="basic-kicker">Blog</p>
        <h1 id="post-title">Placeholder Blog Post Title</h1>
      </div>

      <article class="basic-card blog-post-card">
        <p>Placeholder blog post body</p>
      </article>

      <div class="basic-link-row page-actions">
        <a href="/blog/">Back to Blog</a>
        <a href="/">Back Home</a>
      </div>
    </section>

    <div class="overlay">
      <div class="blog-frame">
        <div class="blog-content">
          <h1>Placeholder Blog Post Title</h1>
          <p>Placeholder blog post body</p>
        </div>
          <a href="/blog/"
            class="hotspot return_from_blog"
            data-sound="blog"
            aria-label="Return to main menu">
            <span class="label">Return</span>
          </a>
      </div>
    </div>
  </main>
</body>
</html>
