<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JKON — Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/scripts/sound.js"></script>
</head>
<body class="home">
  <div id="page-fade" class="active"></div>

  <main id="scene">
    <section class="basic-home" aria-labelledby="basic-home-title">
      <p class="basic-kicker">Portfolio</p>
      <h1 id="basic-home-title">JKonDEV</h1>
      <p>
        Software engineering student and aspiring developer.
      </p>
      <div class="basic-actions">
        <a href="/projects/">View Projects</a>
        <a href="/about/">About Me</a>
        <a href="/blog/">Blog</a>
        <a href="/contact/">Contact</a>
      </div>
    </section>

    <!-- Projects → Bookshelf -->
    <a href="/projects/"
       class="hotspot bookshelf"
       data-sound="open"
       aria-label="Projects">
      <span class="label">Projects</span>
    </a>

    <!-- Blog → Desk -->
    <a href="/blog"
       class="hotspot desk"
       data-sound="blog"
       aria-label="Blog">
      <span class="label">Blog</span>
    </a>

    <!-- About → Fireplace -->
    <a href="/about"
       class="hotspot bed"
       data-sound="about"
       aria-label="About Me">
      <span class="label">About Me</span>
    </a>

    <!-- Contact → Door  -->
    <a href="/contact"
       class="hotspot door"
       data-sound="contact"
       aria-label="Contact">
      <span class="label">Contact</span>
    </a>

  </main>
</body>
</html>
